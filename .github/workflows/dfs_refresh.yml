# DraftKings DFS page (…/dfs/): re-scored after every Player refresh. Written by 97_dfs_publish.R (edit there, not here).
# 96 re-runs the player projections from the props already stored (no API credits), pulls DK main-slate salaries
# (public lobby JSON) and publishes the page. A failure here never affects the Players / D/ST / kicker pages.
name: DFS refresh

on:
  workflow_run:
    workflows: ["Player refresh"]
    types: [completed]
  push:
    branches: [main]
    paths: ["output/dfs/**", "scripts/95_dfs_page.R", "scripts/96_dfs_refresh.R", "scripts/dfs_utils.R", "data/dfs/DKSalaries*.csv", "data/dfs/dk_salaries_*.csv"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dfs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr", "tidyr", "purrr", "tibble", "jsonlite", "curl"))'
      - name: DK salaries and DFS page
        env:
          FF_PROJ_DIR: ${{ github.workspace }}
          LANG: C.UTF-8
        run: |
          git pull -q origin main || true
          Rscript scripts/96_dfs_refresh.R
      - name: Save salaries and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/dfs site/dfs
          if ! git diff --cached --quiet; then
            git commit -m "DFS refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          # the other site refreshes can push at the same moment: rebase onto whatever landed and try again
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push raced another site refresh; retrying ($i of 5)"; sleep $((5 + RANDOM % 15))
          done
          echo "Push failed after 5 tries"; exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
