# The whole website, refreshed in one job: D/ST -> kickers -> rest of season -> players -> DFS -> save -> publish once.
# Written by site_publish.R (edit ET_SCHEDULE there, not here). GitHub cron is UTC only: the lines below are this week's
# Eastern times converted with that week's offset, so the runs follow EDT / EST. GitHub may start a scheduled run 5-30 min
# late; games that have kicked off are locked at their last pre-kickoff lines and props, so a late run never uses in-game odds.
# One run at a time (concurrency), so two deployments can never collide. A page that fails doesn't stop the others; the run
# still publishes what worked and then shows red, naming the failed step.
name: Site refresh

on:
  schedule:
    - cron: "0 14 * * 2-6"  # Tue-Sat 10:00 am EDT: daily line and props movement
    - cron: "0 22 * * 2-3"  # Tue-Wed 6:00 pm EDT: evening look (two trend points a day)
    - cron: "0 22 * * 5-6"  # Fri-Sat 6:00 pm EDT: evening look (two trend points a day)
    - cron: "30 22 * * 4"   # Thu 6:30 pm EDT: before Thursday Night Football
    - cron: "0 12 * * 0"    # Sun 8:00 am EDT: before London games
    - cron: "45 15 * * 0"   # Sun 11:45 am EDT: after inactives for the 1 pm games
    - cron: "35 16 * * 0"   # Sun 12:35 pm EDT: last look before 1 pm kickoffs
    - cron: "5 19 * * 0"    # Sun 3:05 pm EDT: after inactives for the 4:05 / 4:25 games
    - cron: "15 23 * * 0"   # Sun 7:15 pm EDT: before Sunday Night Football
    - cron: "0 23 * * 1"    # Mon 7:00 pm EDT: before Monday Night Football
  push:                      # site_publish.R from RStudio, or a file edited on GitHub
    branches: [main]
    paths: ["output/**", "scripts/**", "data/lines/qb_override.csv", "data/dfs/DKSalaries*.csv", "data/players/props_ci_*.csv", ".github/workflows/site_refresh.yml"]
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write            # commit line / props history and archives
  pages: write               # publish the site
  id-token: write

concurrency:
  group: site-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FF_PROJ_DIR: ${{ github.workspace }}
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # prebuilt Linux binaries: packages install in seconds

      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr", "tidyr", "purrr", "stringr", "tibble", "jsonlite", "curl", "lpSolve"))'

      - name: D/ST (lines, starting QBs, re-score)
        id: dst
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: Rscript scripts/45_dst_refresh.R

      - name: Kickers (same lines + weather forecasts)
        id: kickers
        continue-on-error: true
        run: Rscript scripts/55_k_refresh.R

      - name: Rest of season (D/ST + kickers)
        id: ros
        continue-on-error: true
        run: Rscript scripts/49_ros_page.R

      - name: Players (live props)
        id: players
        continue-on-error: true
        env:
          PROPS_API_KEY: ${{ secrets.PROPS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # ECR history lookups (GitHub API)
        run: Rscript scripts/65_player_refresh.R

      - name: DFS (DraftKings page + lineups)
        id: dfs
        if: ${{ steps.players.outcome == 'success' }}
        continue-on-error: true
        run: Rscript scripts/96_dfs_refresh.R

      - name: Save history and pages
        id: save
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A            # work/ is gitignored
          if ! git diff --cached --quiet; then
            git commit -m "Site refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          # a publish from RStudio can land while this runs: rebase onto it and try again
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push raced a publish; retrying ($i of 5)"; sleep $((5 + RANDOM % 15))
          done
          echo "Push failed after 5 tries"; exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Steps that failed
        if: ${{ always() }}
        run: |
          failed=""
          [ "${{ steps.dst.outcome }}" = "failure" ] && failed="$failed D/ST"
          [ "${{ steps.kickers.outcome }}" = "failure" ] && failed="$failed kickers"
          [ "${{ steps.ros.outcome }}" = "failure" ] && failed="$failed rest-of-season"
          [ "${{ steps.players.outcome }}" = "failure" ] && failed="$failed players"
          [ "${{ steps.players.outcome }}" = "failure" ] && failed="$failed (DFS skipped)"
          [ "${{ steps.dfs.outcome }}" = "failure" ] && failed="$failed DFS"
          [ "${{ steps.save.outcome }}" = "failure" ] && failed="$failed save-history"
          if [ -n "$failed" ]; then echo "::error::Failed:$failed (the site was still published with everything else)"; exit 1; fi
          echo "All pages refreshed."
