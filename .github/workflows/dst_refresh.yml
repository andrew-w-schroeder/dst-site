# Re-scores this week's D/ST projections with the latest sportsbook lines and publishes the page.
# GitHub cron is UTC only. 46_dst_publish.R writes these lines each week from Eastern times (ET_SCHEDULE),
# using the UTC offset of that week's Sunday, so the runs follow EDT / EST automatically.
# GitHub may start a scheduled run 5-30 min late; games that have kicked off are locked at their
# last pre-kickoff line, so a late run never uses in-game odds.
name: DST refresh

on:
  schedule:
    - cron: "0 14 * * 2-6"  # Tue-Sat 10:00 am EDT: daily line movement
    - cron: "30 22 * * 4"   # Thu 6:30 pm EDT: before Thursday Night Football
    - cron: "0 13 * * 0"    # Sun 9:00 am EDT: before London games
    - cron: "45 15 * * 0"   # Sun 11:45 am EDT: after inactives for the 1 pm games
    - cron: "35 16 * * 0"   # Sun 12:35 pm EDT: last look before 1 pm kickoffs
    - cron: "5 19 * * 0"    # Sun 3:05 pm EDT: after inactives for the 4:05 / 4:25 games
    - cron: "15 23 * * 0"   # Sun 7:15 pm EDT: before Sunday Night Football
    - cron: "0 23 * * 1"    # Mon 7:00 pm EDT: before Monday Night Football
  push:                      # a new weekly model was published from RStudio
    branches: [main]
    paths: ["output/dst/**", "output/k/**", "data/lines/qb_override.csv"]   # new weekly model, or a QB override edited on GitHub
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write            # commit line history + archive
  pages: write               # publish the site
  id-token: write

concurrency:
  group: dst-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04    # pinned: ubuntu-latest moves to 26.04 in Oct 2026
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # prebuilt Linux binaries: packages install in seconds

      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr", "tidyr", "purrr", "stringr", "tibble", "jsonlite", "curl"))'

      - name: Re-score with the latest lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FF_PROJ_DIR: ${{ github.workspace }}
          LANG: C.UTF-8
        run: Rscript scripts/45_dst_refresh.R

      - name: Re-score kickers (same lines + weather forecasts)
        continue-on-error: true   # a kicker problem never blocks the D/ST page
        env:
          FF_PROJ_DIR: ${{ github.workspace }}
          LANG: C.UTF-8
        run: Rscript scripts/55_k_refresh.R

      - name: Save line history and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A            # data/lines may not exist yet (no odds pulled); work/ is gitignored
          if ! git diff --cached --quiet; then
            git commit -m "Line refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
