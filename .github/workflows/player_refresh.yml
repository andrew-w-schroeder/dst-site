# Vegas-only player projections: pulls live props (secret PROPS_API_KEY), re-scores and publishes …/players/.
# Written by 66_player_publish.R at each weekly publish (edit ET_SCHEDULE there, not here). Times are UTC for
# the week published (UTC-4). Runs 10 min after each D/ST refresh; started games are locked at their last
# pre-kickoff props, so a late run never uses in-game odds.
name: Player refresh

on:
  schedule:
    - cron: "10 14 * * 2-6"   # 10:10 ET: daily props movement
    - cron: "10 22 * * 2-3"   # 18:10 ET: evening look (two trend points a day)
    - cron: "10 22 * * 5-6"   # 18:10 ET: evening look (two trend points a day)
    - cron: "40 22 * * 4"   # 18:40 ET: before Thursday Night Football
    - cron: "10 13 * * 0"   # 09:10 ET: before London games
    - cron: "55 15 * * 0"   # 11:55 ET: after inactives for the 1 pm games
    - cron: "45 16 * * 0"   # 12:45 ET: last look before 1 pm kickoffs
    - cron: "15 19 * * 0"   # 15:15 ET: after inactives, before the 4:05 / 4:25 games
    - cron: "25 23 * * 0"   # 19:25 ET: before Sunday Night Football
    - cron: "10 23 * * 1"   # 19:10 ET: before Monday Night Football
  push:
    branches: [main]
    paths: ["output/players_site/**", "scripts/64_player_page.R", "scripts/65_player_refresh.R", "scripts/player_site_utils.R", "scripts/ext_player_utils.R", "scripts/props_utils.R", "scripts/site_utils.R", "data/players/props_ci_*.csv"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: player-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr", "tidyr", "purrr", "tibble", "jsonlite", "curl"))'
      - name: Pull props and re-score players
        env:
          PROPS_API_KEY: ${{ secrets.PROPS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # ECR history lookups (GitHub API)
          FF_PROJ_DIR: ${{ github.workspace }}
          LANG: C.UTF-8
        run: Rscript scripts/65_player_refresh.R
      - name: Save props history and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Player props refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          git pull --rebase origin main   # also brings in the latest D/ST and kicker pages before deploying
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
